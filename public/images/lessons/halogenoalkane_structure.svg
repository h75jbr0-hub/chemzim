<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="180" height="65">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="6" stroke="#1e293b" stroke-width="1.5"/>
  
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f8fafc">
    <!-- Main Chain Texts -->
    <text x="25" y="49">CH₃</text>
    <text x="75" y="49">CH</text>
    <text x="125" y="49">CH₂</text>
    <text x="175" y="49">CH</text>
    <text x="205" y="49">CH₃</text>
    
    <!-- Substituents -->
    <text x="75" y="20" fill="#38bdf8">Cl</text>
    <text x="175" y="20" fill="#fb923c">Br</text>
    
    <!-- Horizontal Bonds -->
    <line x1="43" y1="45" x2="62" y2="45" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="88" y1="45" x2="107" y2="45" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="143" y1="45" x2="162" y2="45" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="188" y1="45" x2="193" y2="45" stroke="#94a3b8" stroke-width="1.5" />
    
    <!-- Vertical Bonds to Substituents -->
    <line x1="75" y1="36" x2="75" y2="24" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="175" y1="36" x2="175" y2="24" stroke="#fb923c" stroke-width="1.5" />
  </g>
</svg>
