<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background: linear-gradient(135deg, #070f1e 0%, #0b1b35 100%); border: 1px solid #1e293b; border-radius: 8px;">
  <!-- Definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Grid Lines (Subtle) -->
  <line x1="50" y1="50" x2="750" y2="50" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="50" y1="120" x2="750" y2="120" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="50" y1="240" x2="750" y2="240" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="50" y1="300" x2="750" y2="300" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="50" y1="350" x2="750" y2="350" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="50" y1="400" x2="750" y2="400" stroke="#1e293b" stroke-dasharray="4"/>

  <!-- Energy Axes -->
  <line x1="75" y1="420" x2="75" y2="30" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="55" y="250" fill="#94a3b8" font-family="Inter, sans-serif" font-size="15" font-weight="bold" transform="rotate(-90 55 250)">Energy / kJ mol⁻¹</text>

  <!-- Energy Levels (Left-aligned text, right-aligned cycle transitions) -->
  
  <!-- Level 4: Ions (Na+ + Cl-) -->
  <line x1="100" y1="50" x2="650" y2="50" stroke="#38bdf8" stroke-width="3.5"/>
  <text x="110" y="40" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Na⁺(g) + Cl⁻(g)</text>

  <!-- Level 3: Na+ + e- + Cl -->
  <line x1="100" y1="120" x2="520" y2="120" stroke="#38bdf8" stroke-width="3.5"/>
  <text x="110" y="110" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Na⁺(g) + e⁻ + Cl(g)</text>

  <!-- Level 2: Na + Cl -->
  <line x1="100" y1="240" x2="450" y2="240" stroke="#38bdf8" stroke-width="3.5"/>
  <text x="110" y="230" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Na(g) + Cl(g)</text>

  <!-- Level 1: Na + 1/2 Cl2 -->
  <line x1="100" y1="300" x2="400" y2="300" stroke="#38bdf8" stroke-width="3.5"/>
  <text x="110" y="290" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Na(g) + ½Cl₂(g)</text>

  <!-- Level 0: Elements Na(s) + 1/2 Cl2(g) -->
  <line x1="100" y1="350" x2="350" y2="350" stroke="#38bdf8" stroke-width="3.5"/>
  <text x="110" y="340" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Na(s) + ½Cl₂(g)</text>

  <!-- Level 5: Solid NaCl(s) -->
  <line x1="100" y1="400" x2="650" y2="400" stroke="#e2e8f0" stroke-width="4"/>
  <text x="350" y="422" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="17" font-weight="bold">NaCl(s)</text>

  <!-- Transition Arrows & Labels (All shifted to the right to avoid text overlap) -->
  
  <!-- Atomisation Na (from Level 0 to Level 1) -->
  <line x1="320" y1="350" x2="320" y2="305" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="330" y="332" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ΔHat°(Na) = +108</text>

  <!-- Atomisation Cl (from Level 1 to Level 2) -->
  <line x1="370" y1="300" x2="370" y2="245" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="380" y="278" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ΔHat°(Cl) = +122</text>

  <!-- Ionisation Na (from Level 2 to Level 3) -->
  <line x1="420" y1="240" x2="420" y2="125" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="430" y="188" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">IE₁(Na) = +496</text>

  <!-- Electron Affinity Cl (from Level 3 to Level 4) -->
  <line x1="490" y1="120" x2="490" y2="60" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-down)"/>
  <text x="500" y="95" fill="#f43f5e" font-family="Inter, sans-serif" font-size="12" font-weight="bold">EA₁(Cl) = -349</text>

  <!-- Lattice Energy NaCl (from Level 4 to Level 5) -->
  <line x1="610" y1="50" x2="610" y2="390" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrow-down)"/>
  <text x="625" y="220" fill="#f43f5e" font-family="Inter, sans-serif" font-size="14" font-weight="bold">ΔHlatt° = -788</text>

  <!-- Enthalpy of Formation NaCl (from Level 0 to Level 5) -->
  <line x1="280" y1="350" x2="280" y2="390" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-down)"/>
  <text x="175" y="380" fill="#f43f5e" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ΔHf° = -411</text>
</svg>
