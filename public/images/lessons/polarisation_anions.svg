<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%" style="background: linear-gradient(135deg, #070f1e 0%, #0b1b35 100%); border: 1px solid #1e293b; border-radius: 8px;">
  <!-- 1. Purely Ionic -->
  <g transform="translate(100, 90)">
    <circle cx="-30" cy="0" r="20" fill="#3b82f6" opacity="0.8"/>
    <circle cx="30" cy="0" r="30" fill="#fbbf24" opacity="0.8"/>
    <circle cx="-30" cy="0" r="2" fill="#e2e8f0"/>
    <circle cx="30" cy="0" r="2" fill="#e2e8f0"/>
    <text x="0" y="-55" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Purely Ionic (No Polarisation)</text>
    <text x="-30" y="4" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+</text>
    <text x="30" y="4" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  </g>

  <!-- 2. Polarised Anion -->
  <g transform="translate(300, 90)">
    <circle cx="-35" cy="0" r="20" fill="#3b82f6" opacity="0.8"/>
    <!-- Distorted Anion (ellipse or path) -->
    <path d="M -15,0 C -15,-28 45,-30 45,0 C 45,30 -15,28 -15,0 Z" fill="#fbbf24" opacity="0.8"/>
    <circle cx="-35" cy="0" r="2" fill="#e2e8f0"/>
    <circle cx="20" cy="0" r="2" fill="#e2e8f0"/>
    <text x="0" y="-55" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Polarised Anion (Partial Covalent)</text>
    <text x="-35" y="4" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+</text>
    <text x="20" y="4" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  </g>

  <!-- 3. Covalent Overlap -->
  <g transform="translate(500, 90)">
    <!-- Cation -->
    <circle cx="-30" cy="0" r="20" fill="#3b82f6" opacity="0.8"/>
    <!-- Highly distorted anion overlapping cation -->
    <path d="M -30,0 C -30,-28 35,-30 35,0 C 35,30 -30,28 -30,0 Z" fill="#fbbf24" opacity="0.6"/>
    <circle cx="-30" cy="0" r="2" fill="#e2e8f0"/>
    <circle cx="15" cy="0" r="2" fill="#e2e8f0"/>
    <text x="0" y="-55" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Orbital Overlap (High Covalency)</text>
    <text x="-30" y="4" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+</text>
    <text x="15" y="4" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  </g>
</svg>
