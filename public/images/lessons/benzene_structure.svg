<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100" height="105">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8" stroke="#1e293b" stroke-width="2"/>
  
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
    <!-- Outer Hexagon -->
    <line x1="100" y1="35" x2="160" y2="70" />
    <line x1="160" y1="70" x2="160" y2="140" />
    <line x1="160" y1="140" x2="100" y2="175" />
    <line x1="100" y1="175" x2="40" y2="140" />
    <line x1="40" y1="140" x2="40" y2="70" />
    <line x1="40" y1="70" x2="100" y2="35" />
    
    <!-- Three Alternating Double Bonds (Inner lines) -->
    <line x1="48" y1="75" x2="48" y2="135" />
    <line x1="104" y1="46" x2="152" y2="74" />
    <line x1="152" y1="136" x2="104" y2="164" />
  </g>
</svg>
