<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Hydronium Ion (H₃O⁺)</text>
  <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Dative bond: H₂O donates O lone pair to H⁺</text>

  <!-- Key / Legend -->
  <rect x="290" y="20" width="90" height="45" fill="#1e293b" opacity="0.6" rx="4" />
  <line x1="298" y1="32" x2="318" y2="32" stroke="#475569" stroke-width="2" />
  <text x="324" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Covalent</text>
  
  <path d="M 298,48 L 312,48" stroke="#10b981" stroke-width="2" />
  <polygon points="318,48 312,44 312,52" fill="#10b981" />
  <text x="324" y="51" font-family="system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="bold">Dative (O➔H)</text>

  <g transform="translate(0, 40)">
    <!-- Central Oxygen Atom -->
    <circle cx="200" cy="130" r="28" fill="#581c87" stroke="#a855f7" stroke-width="2" />
    <text x="200" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fae8ff" text-anchor="middle">O</text>

    <!-- Remaining Lone Pair on Oxygen -->
    <ellipse cx="200" cy="85" rx="10" ry="6" fill="#c084fc" opacity="0.3" />
    <circle cx="195" cy="85" r="2" fill="#f3e8ff" />
    <circle cx="205" cy="85" r="2" fill="#f3e8ff" />

    <!-- Left Hydrogen (Standard Covalent) -->
    <line x1="140" y1="165" x2="178" y2="148" stroke="#475569" stroke-width="2.5" />
    <circle cx="125" cy="172" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="125" y="176" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">H</text>

    <!-- Right Hydrogen (Standard Covalent) -->
    <line x1="260" y1="165" x2="222" y2="148" stroke="#475569" stroke-width="2.5" />
    <circle cx="275" cy="172" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="275" y="176" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">H</text>

    <!-- Bottom Hydrogen (Dative Covalent Bond) -->
    <!-- Highlighted Dative Arrow pointing from O to H -->
    <rect x="198.5" y="158" width="3" height="24" fill="#10b981" />
    <polygon points="200,192 195,182 205,182" fill="#10b981" />
    <circle cx="200" cy="208" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="200" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ecfdf5" text-anchor="middle">H</text>

    <!-- Overall Positive Charge brackets -->
    <path d="M 70,30 L 55,30 L 55,230 L 70,230" stroke="#94a3b8" stroke-width="1.5" fill="none" />
    <path d="M 330,30 L 345,30 L 345,230 L 330,230" stroke="#94a3b8" stroke-width="1.5" fill="none" />
    <text x="355" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">+</text>
  </g>
</svg>
