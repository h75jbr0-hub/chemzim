<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <!-- Background Gradient and Border matching Rule 8 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="360" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Cation Hydration (Na+) -->
  <g transform="translate(0, 0)">
    <!-- Title -->
    <text x="250" y="40" fill="#f8fafc" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Cation Hydration (Na⁺)</text>
    
    <!-- Electrostatic attraction dashed lines -->
    <line x1="250" y1="180" x2="250" y2="120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="250" y2="240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="190" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="310" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Top Water (Oxygen facing Na+) -->
    <g transform="translate(250, 100)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" />
      <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="0" y="18" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">δ⁻</text>
      <!-- Hydrogens -->
      <line x1="0" y1="0" x2="-16" y2="-16" stroke="#94a3b8" stroke-width="2" />
      <line x1="0" y1="0" x2="16" y2="-16" stroke="#94a3b8" stroke-width="2" />
      <circle cx="-16" cy="-16" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="16" cy="-16" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="-16" y="-13" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="16" y="-13" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-26" y="-22" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="26" y="-22" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Bottom Water (Oxygen facing Na+) -->
    <g transform="translate(250, 260)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" />
      <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="0" y="-14" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">δ⁻</text>
      <!-- Hydrogens -->
      <line x1="0" y1="0" x2="-16" y2="16" stroke="#94a3b8" stroke-width="2" />
      <line x1="0" y1="0" x2="16" y2="16" stroke="#94a3b8" stroke-width="2" />
      <circle cx="-16" cy="16" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="16" cy="16" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="-16" y="19" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="16" y="19" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-26" y="24" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="26" y="24" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Left Water (Oxygen facing Na+) -->
    <g transform="translate(170, 180)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" />
      <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="15" y="4" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">δ⁻</text>
      <!-- Hydrogens -->
      <line x1="0" y1="0" x2="-18" y2="-12" stroke="#94a3b8" stroke-width="2" />
      <line x1="0" y1="0" x2="-18" y2="12" stroke="#94a3b8" stroke-width="2" />
      <circle cx="-18" cy="-12" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="-18" cy="12" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="-18" y="-9" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-18" y="15" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-28" y="-16" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="-28" y="22" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Right Water (Oxygen facing Na+) -->
    <g transform="translate(330, 180)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" />
      <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="-16" y="4" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">δ⁻</text>
      <!-- Hydrogens -->
      <line x1="0" y1="0" x2="18" y2="-12" stroke="#94a3b8" stroke-width="2" />
      <line x1="0" y1="0" x2="18" y2="12" stroke="#94a3b8" stroke-width="2" />
      <circle cx="18" cy="-12" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="18" cy="12" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="18" y="-9" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="18" y="15" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="26" y="-16" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="26" y="22" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Central Sodium Cation -->
    <circle cx="250" cy="180" r="26" fill="#3b82f6" filter="url(#glowBlue)" />
    <text x="250" y="184" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Na⁺</text>
  </g>

  <!-- Divider Line -->
  <line x1="500" y1="30" x2="500" y2="330" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Right: Anion Hydration (Cl-) -->
  <g transform="translate(500, 0)">
    <!-- Title -->
    <text x="250" y="40" fill="#f8fafc" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Anion Hydration (Cl⁻)</text>
    
    <!-- Electrostatic attraction dashed lines (from Cl- to Hydrogens) -->
    <line x1="250" y1="180" x2="235" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="265" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="235" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="265" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="190" y2="165" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="190" y2="195" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="310" y2="165" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="250" y1="180" x2="310" y2="195" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Top Water (Hydrogens facing Cl-) -->
    <g transform="translate(250, 100)">
      <!-- Oxygen on top -->
      <line x1="0" y1="-20" x2="-15" y2="18" stroke="#94a3b8" stroke-width="2" />
      <line x1="0" y1="-20" x2="15" y2="18" stroke="#94a3b8" stroke-width="2" />
      <circle cx="0" cy="-20" r="14" fill="#ef4444" />
      <text x="0" y="-16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="18" y="-16" fill="#ef4444" font-family="sans-serif" font-size="9">δ⁻</text>
      <!-- Hydrogens facing down -->
      <circle cx="-15" cy="18" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="15" cy="18" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="-15" y="21" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="15" y="21" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-26" y="16" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="24" y="16" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Bottom Water (Hydrogens facing Cl-) -->
    <g transform="translate(250, 260)">
      <!-- Oxygen on bottom -->
      <line x1="0" y1="20" x2="-15" y2="-18" stroke="#94a3b8" stroke-width="2" />
      <line x1="0" y1="20" x2="15" y2="-18" stroke="#94a3b8" stroke-width="2" />
      <circle cx="0" cy="20" r="14" fill="#ef4444" />
      <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="18" y="24" fill="#ef4444" font-family="sans-serif" font-size="9">δ⁻</text>
      <!-- Hydrogens facing up -->
      <circle cx="-15" cy="-18" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="15" cy="-18" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="-15" y="-15" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="15" y="-15" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-26" y="-22" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="24" y="-22" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Left Water (Hydrogens facing Cl-) -->
    <g transform="translate(170, 180)">
      <!-- Oxygen on left -->
      <line x1="-20" y1="0" x2="20" y2="-15" stroke="#94a3b8" stroke-width="2" />
      <line x1="-20" y1="0" x2="20" y2="15" stroke="#94a3b8" stroke-width="2" />
      <circle cx="-20" cy="0" r="14" fill="#ef4444" />
      <text x="-20" y="4" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="-20" y="-16" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">δ⁻</text>
      <!-- Hydrogens facing right -->
      <circle cx="20" cy="-15" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="20" cy="15" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="-12" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="20" y="18" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="26" y="-20" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="26" y="24" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Right Water (Hydrogens facing Cl-) -->
    <g transform="translate(330, 180)">
      <!-- Oxygen on right -->
      <line x1="20" y1="0" x2="-20" y2="-15" stroke="#94a3b8" stroke-width="2" />
      <line x1="20" y1="0" x2="-20" y2="15" stroke="#94a3b8" stroke-width="2" />
      <circle cx="20" cy="0" r="14" fill="#ef4444" />
      <text x="20" y="4" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">O</text>
      <text x="20" y="-16" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">δ⁻</text>
      <!-- Hydrogens facing left -->
      <circle cx="-20" cy="-15" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="-20" cy="15" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="-20" y="-12" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-20" y="18" fill="#0f172a" font-family="sans-serif" font-size="8" text-anchor="middle">H</text>
      <text x="-28" y="-20" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
      <text x="-28" y="24" fill="#38bdf8" font-family="sans-serif" font-size="8">δ⁺</text>
    </g>

    <!-- Central Chloride Anion -->
    <circle cx="250" cy="180" r="26" fill="#ec4899" filter="url(#glowPink)" />
    <text x="250" y="184" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cl⁻</text>
  </g>
</svg>
