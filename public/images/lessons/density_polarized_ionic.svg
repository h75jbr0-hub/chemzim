<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">3. Polarized Ionic (LiI)</text>
  <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Separate contours, but the large iodide ion is distorted by Lithium's charge</text>

  <!-- ==================== Electron Density Contours ==================== -->
  <g transform="translate(-117, -55) scale(1.5)">
    <!-- Separate contours around Li+ (perfectly circular) -->
    <circle cx="130" cy="120" r="22" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.4" />
    <circle cx="130" cy="120" r="14" fill="none" stroke="#22c55e" stroke-width="1.8" opacity="0.8" />

    <!-- Highly distorted/polarized contours around Iodide (pointing to Li+) -->
    <!-- Outer Iodide contour -->
    <path d="M 210,120 C 210,95 240,80 300,80 C 315,95 315,145 300,160 C 240,160 210,145 210,120 Z" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3" />
    <!-- Middle Iodide contour -->
    <path d="M 225,120 C 225,102 245,90 295,90 C 307,100 307,140 295,150 C 245,150 225,138 225,120 Z" fill="none" stroke="#22c55e" stroke-width="1.3" opacity="0.5" />
    <!-- Inner Iodide contours -->
    <ellipse cx="265" cy="120" rx="28" ry="24" fill="none" stroke="#22c55e" stroke-width="1.7" opacity="0.7" />
    <ellipse cx="265" cy="120" rx="16" ry="14" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.9" />

    <!-- ==================== Nuclei (Drawn on top to block contours) ==================== -->
    <!-- Lithium Ion Nucleus -->
    <circle cx="130" cy="120" r="13" fill="#0b1b35" stroke="#f43f5e" stroke-width="2" />
    <text x="130" y="124" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffe4e6" text-anchor="middle">Li⁺</text>
    
    <!-- Iodide Ion Nucleus -->
    <circle cx="260" cy="120" r="16" fill="#0b1b35" stroke="#6366f1" stroke-width="2" />
    <text x="260" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#e0e7ff" text-anchor="middle">I⁻</text>
  </g>
</svg>
