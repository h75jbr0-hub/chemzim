<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <!-- Background with dark gradient to match project styling -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Ammonium Ion (NH₄⁺)</text>
  <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Dative bond: NH₃ lone pair donated to H⁺</text>

  <!-- Key / Legend -->
  <rect x="290" y="20" width="90" height="45" fill="#1e293b" opacity="0.6" rx="4" />
  <line x1="298" y1="32" x2="318" y2="32" stroke="#475569" stroke-width="2" />
  <text x="324" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Covalent</text>
  
  <path d="M 298,48 L 312,48" stroke="#10b981" stroke-width="2" />
  <polygon points="318,48 312,44 312,52" fill="#10b981" />
  <text x="324" y="51" font-family="system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="bold">Dative (N➔H)</text>

  <g transform="translate(0, 40)">
    <!-- Central Nitrogen Atom -->
    <circle cx="200" cy="130" r="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="200" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#e0e7ff" text-anchor="middle">N</text>

    <!-- Left Hydrogen (Standard Covalent) -->
    <line x1="130" y1="130" x2="172" y2="130" stroke="#475569" stroke-width="2.5" />
    <circle cx="115" cy="130" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="115" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">H</text>

    <!-- Bottom Hydrogen (Standard Covalent) -->
    <line x1="200" y1="185" x2="200" y2="158" stroke="#475569" stroke-width="2.5" />
    <circle cx="200" cy="200" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="200" y="204" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">H</text>

    <!-- Right Hydrogen (Standard Covalent) -->
    <line x1="270" y1="130" x2="228" y2="130" stroke="#475569" stroke-width="2.5" />
    <circle cx="285" cy="130" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="285" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">H</text>

    <!-- Top Hydrogen (Dative Covalent Bond) -->
    <!-- Highlighted Dative Arrow pointing from N to H -->
    <rect x="198.5" y="78" width="3" height="24" fill="#10b981" />
    <polygon points="200,68 195,78 205,78" fill="#10b981" />
    <circle cx="200" cy="50" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="200" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ecfdf5" text-anchor="middle">H</text>

    <!-- Overall Positive Charge brackets -->
    <path d="M 70,30 L 55,30 L 55,220 L 70,220" stroke="#94a3b8" stroke-width="1.5" fill="none" />
    <path d="M 330,30 L 345,30 L 345,220 L 330,220" stroke="#94a3b8" stroke-width="1.5" fill="none" />
    <text x="355" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">+</text>
  </g>
</svg>
