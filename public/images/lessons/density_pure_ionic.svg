<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">4. Pure Ionic Model (NaCl)</text>
  <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Completely separate, neat, circular contours with no distortion</text>

  <!-- ==================== Electron Density Contours ==================== -->
  <g transform="translate(-106, -55) scale(1.5)">
    <!-- Separate circular contours around Sodium -->
    <circle cx="130" cy="120" r="24" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.3" />
    <circle cx="130" cy="120" r="16" fill="none" stroke="#22c55e" stroke-width="1.7" opacity="0.7" />
    <circle cx="130" cy="120" r="8" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.9" />

    <!-- Separate circular contours around Chloride -->
    <circle cx="270" cy="120" r="32" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.3" />
    <circle cx="270" cy="120" r="22" fill="none" stroke="#22c55e" stroke-width="1.7" opacity="0.7" />
    <circle cx="270" cy="120" r="12" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.9" />

    <!-- ==================== Nuclei (Drawn on top to block contours) ==================== -->
    <!-- Sodium Ion Nucleus -->
    <circle cx="130" cy="120" r="13" fill="#0b1b35" stroke="#f43f5e" stroke-width="2" />
    <text x="130" y="124" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffe4e6" text-anchor="middle">Na⁺</text>
    
    <!-- Chloride Ion Nucleus -->
    <circle cx="270" cy="120" r="16" fill="#0b1b35" stroke="#6366f1" stroke-width="2" />
    <text x="270" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#e0e7ff" text-anchor="middle">Cl⁻</text>
  </g>
</svg>
