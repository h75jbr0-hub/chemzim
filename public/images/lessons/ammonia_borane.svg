<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <!-- Background with dark gradient to match project styling -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Ammonia Borane (NH₃BF₃)</text>
  <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Dative bond: N donates its lone pair to B</text>

  <!-- Key / Legend -->
  <rect x="290" y="20" width="90" height="45" fill="#1e293b" opacity="0.6" rx="4" />
  <line x1="298" y1="32" x2="318" y2="32" stroke="#475569" stroke-width="2" />
  <text x="324" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Covalent</text>
  
  <path d="M 298,48 L 312,48" stroke="#10b981" stroke-width="2" />
  <polygon points="318,48 312,44 312,52" fill="#10b981" />
  <text x="324" y="51" font-family="system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="bold">Dative (N➔B)</text>

  <g transform="translate(0, 40)">
    <!-- Nitrogen Atom (Donor) -->
    <circle cx="150" cy="130" r="26" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="150" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e0e7ff" text-anchor="middle">N</text>

    <!-- Boron Atom (Acceptor) -->
    <circle cx="250" cy="130" r="26" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <text x="250" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e0e7ff" text-anchor="middle">B</text>

    <!-- Dative Arrow pointing from N to B -->
    <line x1="176" y1="130" x2="214" y2="130" stroke="#10b981" stroke-width="3" />
    <polygon points="224,130 214,125 214,135" fill="#10b981" />

    <!-- Hydrogens bonded to Nitrogen (Standard Covalent) -->
    <line x1="150" y1="130" x2="100" y2="90" stroke="#475569" stroke-width="2" />
    <circle cx="95" cy="85" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="95" y="89" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">H</text>

    <line x1="150" y1="130" x2="100" y2="170" stroke="#475569" stroke-width="2" />
    <circle cx="95" cy="175" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="95" y="179" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">H</text>

    <line x1="150" y1="130" x2="150" y2="70" stroke="#475569" stroke-width="2" />
    <circle cx="150" cy="60" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="150" y="64" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">H</text>

    <!-- Fluorines bonded to Boron (Standard Covalent) -->
    <line x1="250" y1="130" x2="300" y2="90" stroke="#475569" stroke-width="2" />
    <circle cx="305" cy="85" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="305" y="89" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">F</text>

    <line x1="250" y1="130" x2="300" y2="170" stroke="#475569" stroke-width="2" />
    <circle cx="305" cy="175" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="305" y="179" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">F</text>

    <line x1="250" y1="130" x2="250" y2="190" stroke="#475569" stroke-width="2" />
    <circle cx="250" cy="200" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">F</text>
  </g>
</svg>
