<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Aluminium Chloride Dimer (Al₂Cl₆)</text>
  <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Two bridging Cl atoms donate pairs to Al</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="290" y="20" width="90" height="45" fill="#1e293b" opacity="0.6" rx="4" />
  <line x1="298" y1="32" x2="318" y2="32" stroke="#475569" stroke-width="2" />
  <text x="324" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Covalent</text>
  
  <path d="M 298,48 L 312,48" stroke="#10b981" stroke-width="2" />
  <polygon points="318,48 312,44 312,52" fill="#10b981" />
  <text x="324" y="51" font-family="system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="bold">Dative (Cl➔Al)</text>

  <g transform="translate(0, 40)">
    <!-- ==================== BOND LINES (Drawn behind atoms) ==================== -->
    
    <!-- Left-most covalent bonds -->
    <line x1="130" y1="130" x2="70" y2="70" stroke="#475569" stroke-width="2" />
    <line x1="130" y1="130" x2="70" y2="180" stroke="#475569" stroke-width="2" />

    <!-- Right-most covalent bonds -->
    <line x1="270" y1="130" x2="330" y2="70" stroke="#475569" stroke-width="2" />
    <line x1="270" y1="130" x2="330" y2="180" stroke="#475569" stroke-width="2" />

    <!-- Top Bridging Chlorine: Standard Covalent to Left Al -->
    <line x1="130" y1="130" x2="200" y2="90" stroke="#475569" stroke-width="2" />
    
    <!-- Top Bridging Chlorine: Dative Arrow to Right Al -->
    <line x1="200" y1="90" x2="242" y2="114" stroke="#10b981" stroke-width="2.5" />
    <polygon points="252,120 240,117 244,111" fill="#10b981" />

    <!-- Bottom Bridging Chlorine: Standard Covalent to Right Al -->
    <line x1="270" y1="130" x2="200" y2="170" stroke="#475569" stroke-width="2" />
    
    <!-- Bottom Bridging Chlorine: Dative Arrow to Left Al -->
    <line x1="200" y1="170" x2="158" y2="146" stroke="#10b981" stroke-width="2.5" />
    <polygon points="148,140 160,143 156,149" fill="#10b981" />

    <!-- ==================== ATOMS (Drawn on top of lines) ==================== -->

    <!-- Left Aluminium Atom -->
    <circle cx="130" cy="130" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="130" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f0f9ff" text-anchor="middle">Al</text>

    <!-- Right Aluminium Atom -->
    <circle cx="270" cy="130" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="270" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f0f9ff" text-anchor="middle">Al</text>

    <!-- Left-most Chlorine atoms -->
    <circle cx="70" cy="70" r="16" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="70" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">Cl</text>

    <circle cx="70" cy="180" r="16" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="70" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">Cl</text>

    <!-- Right-most Chlorine atoms -->
    <circle cx="330" cy="70" r="16" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="330" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">Cl</text>

    <circle cx="330" cy="180" r="16" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="330" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">Cl</text>

    <!-- Bridging Chlorine Atoms -->
    <circle cx="200" cy="90" r="16" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="200" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">Cl</text>

    <circle cx="200" cy="170" r="16" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="200" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">Cl</text>
  </g>
</svg>
