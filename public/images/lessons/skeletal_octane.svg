<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="150" height="82">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="6" stroke="#1e293b" stroke-width="1.5"/>
  
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Main Chain Zig-Zag -->
    <path d="M 30,35 L 55,50 L 80,35 L 105,50 L 130,35 L 155,50 L 155,75" />
    
    <!-- Left Ethyl Branch -->
    <path d="M 55,50 L 55,75 L 35,87" />
    
    <!-- Middle Methyl Branch (pointing down) -->
    <line x1="105" y1="50" x2="105" y2="75" />
    
    <!-- Right Methyl Branch (pointing up) -->
    <line x1="130" y1="35" x2="130" y2="10" />
  </g>
</svg>
