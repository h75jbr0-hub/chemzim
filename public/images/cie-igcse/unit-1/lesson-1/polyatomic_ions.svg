<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <!-- Definitions for gradients, filters, and glow effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e"/>
      <stop offset="100%" stop-color="#0b1b35"/>
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Text Glow -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feSourceAlpha result="alpha" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vertical Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Glowing Border Overlay -->
  <rect width="1000" height="360" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- TABLE HEADERS -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#94a3b8">
    <text x="50" y="36">NAME</text>
    <text x="320" y="36" fill="#0ea5e9" filter="url(#textGlow)">FORMULA</text>
    
    <text x="550" y="36">NAME</text>
    <text x="820" y="36" fill="#0ea5e9" filter="url(#textGlow)">FORMULA</text>
  </g>

  <!-- Vertical Glowing Dividers -->
  <!-- Left half Name/Formula Divider -->
  <line x1="290" y1="20" x2="290" y2="340" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>
  <!-- Central Main Divider -->
  <line x1="500" y1="15" x2="500" y2="345" stroke="url(#lineGrad)" stroke-width="2" filter="url(#cyanGlow)"/>
  <!-- Right half Name/Formula Divider -->
  <line x1="790" y1="20" x2="790" y2="340" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Horizontal Grid Lines (Subtle) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="30" y1="48" x2="470" y2="48"/>
    <line x1="30" y1="80" x2="470" y2="80"/>
    <line x1="30" y1="112" x2="470" y2="112"/>
    <line x1="30" y1="144" x2="470" y2="144"/>
    <line x1="30" y1="176" x2="470" y2="176"/>
    <line x1="30" y1="208" x2="470" y2="208"/>
    <line x1="30" y1="240" x2="470" y2="240"/>
    <line x1="30" y1="272" x2="470" y2="272"/>
    <line x1="30" y1="304" x2="470" y2="304"/>
    <line x1="30" y1="336" x2="470" y2="336"/>

    <line x1="530" y1="48" x2="970" y2="48"/>
    <line x1="530" y1="80" x2="970" y2="80"/>
    <line x1="530" y1="112" x2="970" y2="112"/>
    <line x1="530" y1="144" x2="970" y2="144"/>
    <line x1="530" y1="176" x2="970" y2="176"/>
    <line x1="530" y1="208" x2="970" y2="208"/>
    <line x1="530" y1="240" x2="970" y2="240"/>
    <line x1="530" y1="272" x2="970" y2="272"/>
    <line x1="530" y1="304" x2="970" y2="304"/>
    <line x1="530" y1="336" x2="970" y2="336"/>
  </g>

  <!-- DATA ROWS - LEFT COLUMN -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">
    <!-- Row 1 -->
    <text x="50" y="70">ammonium</text>
    <text x="320" y="70" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">NH<tspan dy="3" font-size="8.5">4</tspan><tspan dy="-6" font-size="8.5">+</tspan></text>

    <!-- Row 2 -->
    <text x="50" y="102">nitrate</text>
    <text x="320" y="102" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">NO<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-6" font-size="8.5">-</tspan></text>

    <!-- Row 3 -->
    <text x="50" y="134">nitrite</text>
    <text x="320" y="134" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">NO<tspan dy="3" font-size="8.5">2</tspan><tspan dy="-6" font-size="8.5">-</tspan></text>

    <!-- Row 4 -->
    <text x="50" y="166">acetate</text>
    <text x="320" y="166" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">CH<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-3" font-size="12">COO</tspan><tspan dy="-3" font-size="8.5">-</tspan></text>

    <!-- Row 5 -->
    <text x="50" y="198">cyanide</text>
    <text x="320" y="198" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">CN<tspan dy="-3" font-size="8.5">-</tspan></text>

    <!-- Row 6 -->
    <text x="50" y="230">manganate(VII) / permanganate</text>
    <text x="320" y="230" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">MnO<tspan dy="3" font-size="8.5">4</tspan><tspan dy="-6" font-size="8.5">-</tspan></text>

    <!-- Row 7 -->
    <text x="50" y="262">iodate</text>
    <text x="320" y="262" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">IO<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-6" font-size="8.5">-</tspan></text>

    <!-- Row 8 -->
    <text x="50" y="294">perchlorate</text>
    <text x="320" y="294" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">ClO<tspan dy="3" font-size="8.5">4</tspan><tspan dy="-6" font-size="8.5">-</tspan></text>

    <!-- Row 9 -->
    <text x="50" y="326">chlorate</text>
    <text x="320" y="326" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">ClO<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-6" font-size="8.5">-</tspan></text>
  </g>

  <!-- DATA ROWS - RIGHT COLUMN -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">
    <!-- Row 1 -->
    <text x="550" y="70">hydroxide</text>
    <text x="820" y="70" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">OH<tspan dy="-3" font-size="8.5">-</tspan></text>

    <!-- Row 2 -->
    <text x="550" y="102">peroxide</text>
    <text x="820" y="102" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">O<tspan dy="3" font-size="8.5">2</tspan><tspan dy="-6" font-size="8.5">2-</tspan></text>

    <!-- Row 3 -->
    <text x="550" y="134">carbonate</text>
    <text x="820" y="134" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">CO<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-6" font-size="8.5">2-</tspan></text>

    <!-- Row 4 -->
    <text x="550" y="166">sulfate</text>
    <text x="820" y="166" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">SO<tspan dy="3" font-size="8.5">4</tspan><tspan dy="-6" font-size="8.5">2-</tspan></text>

    <!-- Row 5 -->
    <text x="550" y="198">sulfite</text>
    <text x="820" y="198" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">SO<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-6" font-size="8.5">2-</tspan></text>

    <!-- Row 6 -->
    <text x="550" y="230">phosphate</text>
    <text x="820" y="230" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">PO<tspan dy="3" font-size="8.5">4</tspan><tspan dy="-6" font-size="8.5">3-</tspan></text>

    <!-- Row 7 -->
    <text x="550" y="262">phosphite</text>
    <text x="820" y="262" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">PO<tspan dy="3" font-size="8.5">3</tspan><tspan dy="-6" font-size="8.5">3-</tspan></text>

    <!-- Row 8 -->
    <text x="550" y="294">chromate(VI) / chromate</text>
    <text x="820" y="294" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">CrO<tspan dy="3" font-size="8.5">4</tspan><tspan dy="-6" font-size="8.5">2-</tspan></text>

    <!-- Row 9 -->
    <text x="550" y="326">dichromate(VI) / dichromate</text>
    <text x="820" y="326" fill="#22d3ee" font-weight="600" filter="url(#textGlow)">Cr<tspan dy="3" font-size="8.5">2</tspan><tspan dy="-3" font-size="12">O</tspan><tspan dy="3" font-size="8.5">7</tspan><tspan dy="-6" font-size="8.5">2-</tspan></text>
  </g>
</svg>
